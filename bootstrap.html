<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .btn-primary{
            background-color: rgb(0, 136, 255);
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="text-info mt-3">Belajar Bootstrap</h1>
        <!-- 
        Primary (biru) 
        Secondary(Abu abu)
        Danger (merah)
        Warning (Kuning)
        Success(Hijau)
        Info(Biru Muda)
        Dark(Hitam)
        light (putih)
        -->
        <button class="btn btn-success mt-4 rounded-pill">Click</button>
        <button class="btn btn-primary rounded-pill">Click</button>
        <button class="btn btn-info mt-4 rounded-pill">Click</button>
        <button class="btn btn-warning text-success rounded-pill">Click</button>
        <button class="btn btn-secondary mt-4 rounded-pill">Click</button>
        <button class="btn btn-dark rounded-pill">Click</button>
        <button class="btn btn-danger mt-4 rounded-pill">Click</button>
    </div>
    <header class="header mt-5 bg-dark">
        <div class="container d-flex align-items-center">
            <div class=" img p-4">
                <img src="assets/images/logo.webp" width="50px"  >
            </div>
            <div class="ms-auto">
                    <a href="#" class=" a text-light text-decoration-none">Home</a>
                    <a href="#" class=" a text-light text-decoration-none">About</a>
                    <a href="#" class=" a text-light text-decoration-none">Contact</a>
            </div>    
        </div>
    </header>
    <!-- grid system -->
     <div class="row">
        <div class="col-md-4">
            <img src="assets/images/berita 2.webp" width="100%" alt="">
     </div>
     <div class="col-md-8">

     </div>
     </div>
     
</body>
</html>
